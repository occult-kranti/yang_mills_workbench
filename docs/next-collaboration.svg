<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920" role="img" aria-labelledby="title desc">
<title id="title">Three-role six-loop collaboration</title><desc id="desc">Forward and backward researchers report independently to the advisor. Each pair is sequential; a second advisor decision follows Goal A.</desc>
<rect width="900" height="920" rx="20" fill="#f7fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#385777"/></marker></defs>
<rect x="30" y="25" width="230" height="68" rx="12" fill="#17637a"/><text x="145" y="65" text-anchor="middle" fill="white" font-size="19" font-family="sans-serif">Forward researcher</text>
<rect x="335" y="25" width="230" height="68" rx="12" fill="#49376e"/><text x="450" y="65" text-anchor="middle" fill="white" font-size="19" font-family="sans-serif">Advisor–skeptic</text>
<rect x="640" y="25" width="230" height="68" rx="12" fill="#17637a"/><text x="755" y="65" text-anchor="middle" fill="white" font-size="19" font-family="sans-serif">Backward researcher</text>
<path d="M260 60H332 M640 60H570" stroke="#385777" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="450" y="128" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#34485c">Independent evidence → critique → accepted next contract</text>
<rect x="85" y="155" width="730" height="95" rx="12" fill="white" stroke="#b7c9d5"/><text x="450" y="189" text-anchor="middle" font-size="22" font-weight="bold" font-family="sans-serif" fill="#20384b">Initial advisor decision</text><text x="450" y="221" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#40586b">Review inherited goals and freeze A1</text>
<path d="M450 250V270" stroke="#385777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="275" width="730" height="95" rx="12" fill="white" stroke="#b7c9d5"/><text x="450" y="309" text-anchor="middle" font-size="22" font-weight="bold" font-family="sans-serif" fill="#20384b">A1 → A2</text><text x="450" y="341" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#40586b">Dressed bridge → growing-family exception</text>
<path d="M450 370V390" stroke="#385777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="395" width="730" height="95" rx="12" fill="white" stroke="#b7c9d5"/><text x="450" y="429" text-anchor="middle" font-size="22" font-weight="bold" font-family="sans-serif" fill="#20384b">Post-A advisor decision</text><text x="450" y="461" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#40586b">Revise B and C from the two accepted A loops</text>
<path d="M450 490V510" stroke="#385777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="515" width="730" height="95" rx="12" fill="white" stroke="#b7c9d5"/><text x="450" y="549" text-anchor="middle" font-size="22" font-weight="bold" font-family="sans-serif" fill="#20384b">B1 → B2</text><text x="450" y="581" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#40586b">Complete omitted spectrum → full energy enclosure</text>
<path d="M450 610V630" stroke="#385777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="635" width="730" height="95" rx="12" fill="white" stroke="#b7c9d5"/><text x="450" y="669" text-anchor="middle" font-size="22" font-weight="bold" font-family="sans-serif" fill="#20384b">C1 → C2</text><text x="450" y="701" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#40586b">Complete central coordinates → surrounding integration</text>
<path d="M450 730V750" stroke="#385777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="755" width="730" height="95" rx="12" fill="white" stroke="#b7c9d5"/><text x="450" y="789" text-anchor="middle" font-size="22" font-weight="bold" font-family="sans-serif" fill="#20384b">Next roadmap</text><text x="450" y="821" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#40586b">Retain open homogeneous, bulk and continuum bridges</text>
</svg>
