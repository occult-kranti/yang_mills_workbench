<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" role="img" aria-labelledby="title desc"><title id="title">Six research loops and two advisory decisions</title><desc id="desc">Forward and backward researchers independently report to the advisor. Each gate selects the next loop. A second planning decision follows A2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#597080"/></marker></defs><rect width="900" height="880" fill="white"/><text x="170" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b38">Forward researcher</text><text x="450" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b38">Advisor–skeptic</text><text x="730" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b38">Backward researcher</text><rect x="335" y="58" width="230" height="54" fill="#e9f0ed" stroke="#244f62" stroke-width="1.5"/><text x="450" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#172b38">Plan · Decision</text><text x="450" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#172b38">Initial advisor review</text><path d="M450 113V157" stroke="#597080" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="55" y="161" width="230" height="48" fill="#f3f6f8" stroke="#597080"/><text x="170" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b38">Derive and compute</text><rect x="615" y="161" width="230" height="48" fill="#f3f6f8" stroke="#597080"/><text x="730" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b38">Rebuild and challenge</text><path d="M285 185H329M615 185H571" fill="none" stroke="#597080" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="335" y="158" width="230" height="54" fill="#fff" stroke="#244f62" stroke-width="1.5"/><text x="450" y="180" text-anchor="middle" font-